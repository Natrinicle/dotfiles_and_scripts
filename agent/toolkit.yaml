kind: agent-toolkit
version: "0.6.37"
source: sanitized copy of agent skills/rules
description: >
  Portable agent skills for Grok/Claude-style agents. Includes writing-style
  isolation, scanners, packaging, and domain tools.
placeholders:
  user: "{user}"
  company: "{company}"
  location: "{location}"
  home: "${HOME}"
notes:
  - nate-writing-style ships {user} placeholder voice notes; replace with your own. Directory name is kept for install-path stability.
  - Multi-party group chat isolation: only verified {user} messages update the style profile.
  - Residual personal tokens are ship-blockers. Do not leave real names in style reference files.
install: see README.md
