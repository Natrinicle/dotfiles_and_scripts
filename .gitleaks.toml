# Extends gitleaks defaults. The pre-commit hook pins v8.30.1; a
# PATH binary (this host has seen 8.21.2) can miss generic-api-key hits.
title = "dotfiles_and_scripts"

[extend]
useDefault = true

[allowlist]
description = "Public WebCrypto/NIST algorithm names (not secrets)"
regexTarget = "secret"
regexes = [
    '''^MLKEM768-X25519$''',
]
