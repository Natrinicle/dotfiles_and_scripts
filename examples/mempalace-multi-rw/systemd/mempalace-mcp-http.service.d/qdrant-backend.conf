[Unit]
# User units cannot Require a system docker.service; probe REST instead.

[Service]
# Clear the unit-file ExecStart so this drop-in replaces a Chroma palace.
ExecStart=
ExecStart=%h/.local/bin/mempalace serve \
  --host 0.0.0.0 \
  --port 8765 \
  --backend qdrant \
  --palace %h/.var/mempalace/palace
TimeoutStartSec=180
Environment=MEMPALACE_PALACE_PATH=%h/.var/mempalace/palace
Environment=MEMPALACE_BACKEND=qdrant
Environment=MEMPALACE_QDRANT_URL=http://127.0.0.1:6333
Environment=MEMPALACE_QDRANT_TIMEOUT=120
# Qdrant is a multi-process writer. This lets the write daemon (and other
# qdrant clients) sit beside the hub. Chroma still cannot use this bypass.
Environment=MEMPALACE_MCP_ALLOW_PEER_WRITER=1
ExecStartPre=/bin/bash -c 'for i in $(seq 1 30); do curl -sf http://127.0.0.1:6333/readyz >/dev/null && exit 0; sleep 1; done; echo "qdrant :6333 not ready" >&2; exit 1'
