name: mempalace

# Qdrant for a host systemd MemPalace hub.
# Default `compose up` is Qdrant only. MCP sidecar is profile `sidecar`
# (copy/verify). Do not run the sidecar beside systemd :8765.
#
# Palace path inside the sidecar must be the same expanded string as
# systemd --palace so Qdrant collection names (hash of PalaceRef.id) match.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: mempalace-qdrant
    restart: unless-stopped
    init: true
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - qdrant-storage:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  mempalace:
    profiles: ["sidecar"]
    image: ghcr.io/mempalace/mempalace:3.10.0
    container_name: mempalace-mcp
    restart: "no"
    init: true
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    depends_on:
      qdrant:
        condition: service_healthy
    command:
      - serve
      - --host
      - "0.0.0.0"
      - --port
      - "8765"
      - --backend
      - qdrant
      - --palace
      - ${HOME}/.var/mempalace/palace
    env_file:
      - .env
    environment:
      HOME: /data
      MEMPALACE_BACKEND: qdrant
      MEMPALACE_PALACE_PATH: ${HOME}/.var/mempalace/palace
      MEMPALACE_QDRANT_URL: http://qdrant:6333
      MEMPALACE_QDRANT_TIMEOUT: "120"
      MEMPALACE_EMBEDDING_DEVICE: cpu
    ports:
      - "127.0.0.1:8775:8765"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - mempalace-data:${HOME}/.var/mempalace
      - mempalace-home:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/healthz').read().strip()==b'ok' else 1)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  qdrant-storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/.local/share/mempalace/qdrant
  mempalace-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/.var/mempalace
  mempalace-home:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/.var/mempalace/container-home
