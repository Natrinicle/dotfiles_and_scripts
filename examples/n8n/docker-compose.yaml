name: n8n

# n8n workflow UI — rootless engine, Traefik Host n8n.localhost.
# Pin docker.n8n.io/n8nio/n8n:2.44.7.
# Do not publish host :5678. Owner is created on first UI visit; keep
# user management on. API key is created in the UI after owner setup.
#
# State: ${HOME}/.var/n8n → /home/node/.n8n (named bind).
# Secret: ./.env (N8N_ENCRYPTION_KEY, mode 0600). Copy from .env.example.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.7
    container_name: n8n
    restart: always
    # Rootless engine: container uid 0 is the host user. Image USER=node
    # (uid 1000) maps to host 101000 and cannot write ${HOME}/.var/n8n.
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      # N8N_USER_FOLDER is the parent of `.n8n` (default ~). HOME=/home/node
      # → data at /home/node/.n8n, which is the named bind.
      - HOME=/home/node
      - N8N_USER_FOLDER=/home/node
      - N8N_HOST=n8n.localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_EDITOR_BASE_URL=http://n8n.localhost/
      - N8N_WEBHOOK_URL=http://n8n.localhost/
      - N8N_PROXY_HOPS=1
      - N8N_SECURE_COOKIE=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
      - TZ=${TZ:-UTC}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - n8n-data:/home/node/.n8n
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.n8n.rule=Host(`n8n.localhost`)
      - traefik.http.routers.n8n.entrypoints=web
      - traefik.http.services.n8n.loadbalancer.server.port=5678
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

networks:
  traefik:
    external: true
    name: traefik

volumes:
  n8n-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/.var/n8n
