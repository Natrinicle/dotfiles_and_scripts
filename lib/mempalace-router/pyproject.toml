[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mempalace-router"
version = "0.1.0"
description = "Scope-routed MCP forwarder for MemPalace hubs"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6,<7"]

[project.scripts]
mempalace-router = "mempalace_router.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
